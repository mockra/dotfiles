set-window-option -g mode-keys vi

# force a reload of the config file
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# smart pane switching with awareness of vim splits
bind -n C-h run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys C-h) || tmux select-pane -L"
bind -n C-j run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys C-j) || tmux select-pane -D"
bind -n C-k run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys C-k) || tmux select-pane -U"
bind -n C-l run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys C-l) || tmux select-pane -R"

# For osc-yank to work
set -as terminal-features ',tmux-256color:clipboard'
set -s set-clipboard on

# Turn off buffer renaming
set-option -g allow-rename off

# Higher history limit
set-option -g history-limit 50000

# activity alert
setw -g monitor-activity on
set -g visual-activity off

set -g  default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# New window with default path set to last path
bind c new-window -c "#{pane_current_path}"

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel

# Update default binding of `Enter` to also use copy-pipe
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send -X copy-pipe

# Remove delay from prefix to command
set -s escape-time 0
set -g prefix C-p
unbind-key C-b
bind-key C-p send-prefix

# Fix resizing to accomodate smaller clients
setw -g aggressive-resize on

# split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when we close random ones
set -g renumber-windows on

# This makes the terminal's native scrollbar work in tmux.
set-option -g mouse on
set-option -g focus-events on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'rose-pine/tmux'

set -g @rose_pine_variant 'dawn'
set -g @rose_pine_directory 'on'
set -g @rose_pine_host 'off'
set -g @rose_pine_date_time '%Y-%m-%d %-I:%M %p'
set -g @rose_pine_disable_active_window_menu 'on'

# azath bindings
# prefix + G -> open the dashboard
bind-key g run-shell "$HOME/bin/azath dash"

# prefix + E -> open the editor in the current project's session
bind-key E run-shell "$HOME/bin/azath edit"

# prefix + t -> popup todo capture
bind-key t display-popup -w 80% -h 80% -E "nvim ~/todo.md"

# Initialize TMUX plugins before applying local style overrides.
run '~/.tmux/plugins/tpm/tpm'

# Rosé Pine Dawn uses similar foreground colors for active and inactive windows.
# Give the active window a solid Pine background so it remains obvious at a glance.
setw -g window-status-format ' #I:#W#{?window_flags,#{window_flags}, } '
setw -g window-status-current-format '#[fg=#faf4ed,bg=#286983,bold] #I:#W#{?window_flags,#{window_flags}, } '
setw -g window-status-separator '#[fg=#faf4ed,bg=#faf4ed] '
setw -g window-status-style 'fg=#797593,bg=#faf4ed'
setw -g window-status-current-style 'fg=#faf4ed,bg=#286983,bold'
setw -g window-status-activity-style 'fg=#faf4ed,bg=#d7827e,bold'
set -g pane-border-style 'fg=#dfdad9'
set -g pane-active-border-style 'fg=#286983'
set -g status-keys vi

# Add one blank row between panes and the bottom status bar.
set -g status 2
set -gu status-format
run-shell 'status_bar="$(tmux show-options -gv "status-format[0]")"; tmux set-option -g "status-format[0]" ""; tmux set-option -g "status-format[1]" "$status_bar"'
